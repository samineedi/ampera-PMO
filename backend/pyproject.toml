[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmo"
version = "1.0.0"
description = "PMO automation: Trello dashboards, weekly reports, planning and closure"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",   # Gemini is the only LLM provider; without GOOGLE_API_KEY a template draft is used
    "requests>=2.31",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 170
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741", "E731"]                      # `l` for a label and one-line lambdas are used throughout

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]                 # env vars must be set before pmo is imported
